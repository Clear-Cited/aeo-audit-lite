on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"     # weekly safety net
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: cssnr/mirror-repository-action@v1
        with:
          host: codeberg.org
          username: Clear-Cited
          password: ${{ secrets.b0231af857677cd64dfa4012e93f6a69d5593a5d }}
